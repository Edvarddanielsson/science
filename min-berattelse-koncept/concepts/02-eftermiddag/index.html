<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eftermiddag – Min berättelse</title>
<link rel="stylesheet" href="/shared/fonts.css">
<link rel="stylesheet" href="/shared/phone.css">
<script>window.__ready = false;</script>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
<style>
  :root { --ink: #5b4129; }
  html, body { margin: 0; height: 100%; }
  body { width: 1920px; height: 1080px; overflow: hidden; position: relative; background: #e3d1b3; }
  .gl, .css3d { position: absolute !important; inset: 0; }
  .gl { z-index: 2; filter: sepia(.28) saturate(.82) contrast(1.02); }
  .css3d { z-index: 3; }
  .haze { position: absolute; inset: 0; z-index: 8; pointer-events: none;
    background:
      radial-gradient(1000px 700px at 66% 40%, rgba(255,214,150,.16), transparent 70%),
      radial-gradient(1500px 1000px at 50% 50%, transparent 58%, rgba(60,35,15,.30)); }
  .grain { position: absolute; inset: 0; z-index: 9; pointer-events: none; background-image: var(--grain); background-size: 256px; opacity: .55; mix-blend-mode: overlay; }

  .mark { position: absolute; left: 96px; top: 78px; width: 50px; height: 50px; z-index: 10; }
  .gift { position: absolute; right: 100px; top: 82px; z-index: 10; font: italic 500 34px 'Cormorant Garamond', serif; color: var(--ink); letter-spacing: .01em;
    border-bottom: 1.5px solid rgba(91,65,41,.45); padding-bottom: 2px; }
  h1 {
    position: absolute; z-index: 10; left: 150px; top: 262px; margin: 0;
    font: italic 500 112px/1.02 'Cormorant Garamond', serif; color: var(--ink); letter-spacing: -0.01em;
  }

  .phone.css3d-phone { --pw: 351px; --ui-ink: #4b3624; background: none; }
  .phone.css3d-phone::before { display: none; }
  .phone .screen { background: #fffaf0; }
  .phone .screen::after { content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(122deg, rgba(255,240,210,0) 40%, rgba(255,240,210,.26) 47%, rgba(255,240,210,0) 60%); }
  .logo { position: absolute; top: 128px; left: 50%; transform: translateX(-50%); width: 64px; height: 64px; }
  .mic {
    position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%);
    width: 196px; height: 196px; border-radius: 50%;
    background: radial-gradient(circle at 50% 36%, #fff5cf 0%, #f9dc84 30%, #edb94a 66%, #d99a2b 100%);
    box-shadow:
      0 0 0 12px rgba(249,214,120,.20),
      0 0 0 26px rgba(249,214,120,.10),
      0 0 60px 22px rgba(245,190,80,.42),
      inset 0 -12px 20px rgba(165,100,15,.30),
      inset 0 10px 16px rgba(255,255,255,.55);
    display: grid; place-items: center;
  }
  .mic svg { width: 84px; height: 124px; filter: drop-shadow(0 2px 3px rgba(150,90,10,.35)); }
  .cue { position: absolute; left: 0; right: 0; bottom: 56px; text-align: center; font: 700 23px 'Nunito', sans-serif; letter-spacing: .03em; color: #6a4a28; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 64 64" fill="none" stroke="#5b4129" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M8 46c8-4 16-4 24 0 8-4 16-4 24 0V20c-8-4-16-4-24 0-8-4-16-4-24 0Z"/><path d="M32 20v26"/><path d="M24 12c3-3 13-3 16 0"/>
  </svg>
  <a class="gift">Gåva</a>
  <h1>Låt din historia<br>leva vidare.</h1>

  <div class="phone css3d-phone" id="phone-dom">
    <div class="screen" data-status>
      <div class="app">
        <svg class="logo" viewBox="0 0 64 64" fill="none" stroke="#c99436" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 46c8-4 16-4 24 0 8-4 16-4 24 0V20c-8-4-16-4-24 0-8-4-16-4-24 0Z" fill="#fbecc8"/><path d="M32 20v26"/><path d="M24 12c3-3 13-3 16 0"/>
        </svg>
        <div class="mic" role="button" aria-label="Spela in">
          <svg viewBox="0 0 64 96" aria-hidden="true">
            <rect x="18" y="3" width="28" height="52" rx="14" fill="#fffaf0"/>
            <path d="M8 40a24 24 0 0 0 48 0" fill="none" stroke="#fffaf0" stroke-width="7" stroke-linecap="round"/>
            <rect x="28.5" y="63" width="7" height="17" fill="#fffaf0"/>
            <rect x="17" y="80" width="30" height="8" rx="4" fill="#fffaf0"/>
          </svg>
        </div>
        <div class="cue">Berätta</div>
      </div>
    </div>
  </div>

  <div class="haze"></div>
  <div class="grain"></div>

<script type="module">
  import { THREE, createStage, buildPhone, buildLyingBook, canvasTexture, pageEdges, PHONE } from '/shared/three-kit.js';
  import { linen, paper, grain, url, rng } from '/shared/textures.js';
  import { decoratePhones } from '/shared/phone.js';
  decoratePhones();
  document.documentElement.style.setProperty('--grain', url(grain({ size: 512, alpha: .08 })));

  const stage = createStage({ fov: 22, exposure: 0.98, envIntensity: 0.22 });
  const { scene, camera, renderer } = stage;
  document.body.appendChild(renderer.domElement);
  document.body.appendChild(stage.css.domElement);
  scene.background = new THREE.Color(0xd9c4a2);

  // ---------- materials
  const wallTex = canvasTexture(paper({ w: 1024, h: 1024, base: '#ead9bc', seed: 5, mottle: .07, fibers: 0, tooth: 10 }), { repeat: [3, 2] });
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(16, 8), new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.95 }));
  wall.position.set(0, 4, -1.25); wall.receiveShadow = true;
  scene.add(wall);

  function woodCanvas() {
    const c = document.createElement('canvas'); c.width = 2048; c.height = 512;
    const g = c.getContext('2d'), r = rng(17);
    g.fillStyle = '#c79e6c'; g.fillRect(0, 0, c.width, c.height);
    for (let i = 0; i < 260; i++) {
      const y0 = r() * c.height, amp = 2 + r() * 8, f = 0.002 + r() * 0.004, ph = r() * 6;
      g.strokeStyle = r() > .5 ? `rgba(120,80,40,${.05 + r() * .14})` : `rgba(255,235,200,${.04 + r() * .1})`;
      g.lineWidth = 0.6 + r() * 2.4;
      g.beginPath();
      for (let x = 0; x <= c.width; x += 16) g.lineTo(x, y0 + Math.sin(x * f + ph) * amp);
      g.stroke();
    }
    return c;
  }
  const table = new THREE.Mesh(new THREE.BoxGeometry(16, 0.3, 6), new THREE.MeshPhysicalMaterial({
    map: canvasTexture(woodCanvas(), { repeat: [2, 1] }), roughness: 0.55, clearcoat: 0.25, clearcoatRoughness: 0.5 }));
  table.position.set(0, -0.15, 1.75); table.receiveShadow = true;
  scene.add(table);

  const pagesMat = new THREE.MeshStandardMaterial({ map: canvasTexture(pageEdges({ base: '#f1e4c9', horizontal: true }), { repeat: [1, 1] }), roughness: 0.85 });
  const cloth = (hex, seed, rep = [3, 3]) => new THREE.MeshPhysicalMaterial({
    map: canvasTexture(linen({ size: 256, base: hex, seed, contrast: .9, pitch: 2 }), { repeat: rep }),
    roughness: 0.9, sheen: 0.7, sheenRoughness: 0.5, sheenColor: new THREE.Color(0xfff0d8) });

  // ---------- the book stack
  const stack = new THREE.Group();
  const b1 = buildLyingBook({ W: 1.62, T: 0.17, D: 1.2, cloth: cloth('#c88c4b', 3), pages: pagesMat });
  const b2 = buildLyingBook({ W: 1.34, T: 0.13, D: 0.98, cloth: cloth('#e8cc98', 8), pages: pagesMat });
  b2.position.set(0.05, 0.17, 0.02); b2.rotation.y = 0.09;
  const b3 = buildLyingBook({ W: 1.1, T: 0.1, D: 0.8, cloth: cloth('#c38a74', 12), pages: pagesMat });
  b3.position.set(-0.02, 0.30, -0.02); b3.rotation.y = -0.06;
  stack.add(b1, b2, b3);
  stack.position.set(1.42, 0, -0.6);
  stack.rotation.y = Math.PI / 2 - 0.55;
  scene.add(stack);

  // ---------- the phone, leaning against the wall in the sun
  const frame = new THREE.MeshPhysicalMaterial({ color: 0xdcc39b, roughness: 0.28, metalness: 0.75, clearcoat: 0.4 });
  const phone = buildPhone({ frame, dom: document.getElementById('phone-dom') });
  const lean = 0.2;
  phone.rotation.x = -lean;
  phone.rotation.y = -0.1;
  phone.position.set(0.18, Math.cos(lean) * PHONE.h / 2 + 0.005, -1.25 + Math.sin(lean) * PHONE.h / 2 + PHONE.d / 2 + 0.01);
  phone.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(phone);

  // ---------- light: low sun through a mullioned window, leaves outside
  function windowCookie() {
    const S = 1024, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d'), r = rng(23);
    g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
    g.filter = 'blur(7px)';
    g.fillStyle = '#fff';
    const x0 = S * .2, y0 = S * .16, w = S * .6, h = S * .68, m = S * .024, cols = 2, rows = 3;
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
      const pw = (w - m * (cols - 1)) / cols, ph = (h - m * (rows - 1)) / rows;
      g.fillRect(x0 + i * (pw + m), y0 + j * (ph + m), pw, ph);
    }
    // dappled leaf shadows drifting in from the top corner
    g.filter = 'blur(14px)';
    g.fillStyle = 'rgba(0,0,0,.78)';
    for (let k = 0; k < 46; k++) {
      const cx = S * (.52 + r() * .4), cy = S * (.08 + r() * .36), rx = 14 + r() * 34, ry = 8 + r() * 16;
      g.beginPath(); g.ellipse(cx, cy, rx, ry, r() * Math.PI, 0, Math.PI * 2); g.fill();
    }
    g.filter = 'none';
    return c;
  }
  const cookie = canvasTexture(windowCookie(), { srgb: true });
  cookie.wrapS = cookie.wrapT = THREE.ClampToEdgeWrapping;
  const sun = new THREE.SpotLight(0xffdcae, 8.5, 0, 0.215, 0.2, 0);
  sun.position.set(6.2, 6.4, 6.0);
  sun.target.position.set(0.9, 1.3, -1.25);
  sun.map = cookie;
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 6; sun.shadow.blurSamples = 20; sun.shadow.bias = -0.0003;
  sun.shadow.camera.near = 4; sun.shadow.camera.far = 20;
  scene.add(sun, sun.target);
  scene.add(new THREE.HemisphereLight(0xffe4bd, 0x6e4b2a, 0.5));
  const fill = new THREE.DirectionalLight(0xffe2b8, 0.25);
  fill.position.set(-5, 3, 6);
  scene.add(fill);

  camera.position.set(-0.35, 1.02, 7.15);
  camera.lookAt(0.05, 0.98, -1.25);

  stage.render();
  await document.fonts.ready;
  requestAnimationFrame(() => { stage.render(); window.__ready = true; });
</script>
</body>
</html>
